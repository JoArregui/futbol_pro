name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  flutter:
    name: Flutter analyze + format + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
      # firebase_options.dart está en .gitignore: stub mínimo para CI.
      - run: |
          if [ ! -f lib/firebase_options.dart ]; then
            printf "import 'package:firebase_core/firebase_core.dart';\nclass DefaultFirebaseOptions {\n  static FirebaseOptions get currentPlatform => const FirebaseOptions(apiKey: 'ci', appId: 'ci', messagingSenderId: 'ci', projectId: 'ci');\n}\n" > lib/firebase_options.dart;
          fi
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --coverage
        env:
          JWT_SECRET: ci-test-secret
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  server:
    name: Server lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: |
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do node --check "$f" || exit 1; done
      - run: npm test -- --runInBand --forceExit
        env:
          JWT_SECRET: ci-test-secret
          SUPERADMIN_EMAIL: ci@test.com
          SUPERADMIN_PASSWORD: CiTest123!
