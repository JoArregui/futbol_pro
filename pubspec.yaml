name: futbol_pro
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # ----------------------------------------
  # GESTIÓN DE ESTADO Y ARQUITECTURA
  # ----------------------------------------
  flutter_bloc: ^9.1.1 # Versión actualizada
  equatable: ^2.0.5 
  dartz: ^0.10.1
  get_it: ^9.1.0
  
  # ----------------------------------------
  # NAVEGACIÓN
  # ----------------------------------------
  go_router: ^17.0.0
  
  # ----------------------------------------
  # SERVICIOS (VERSIONES CRÍTICAS ACTUALIZADAS)
  # ----------------------------------------
  http: ^1.2.1 
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  intl: ^0.20.2
  cloud_firestore: ^6.1.0
  image_picker: ^1.2.0
  firebase_storage: ^13.0.4
  flutter_local_notifications: ^19.5.0
  badges: ^3.1.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  socket_io_client: ^3.1.2
  cached_network_image: ^3.4.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.5
  sentry_flutter: ^8.14.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  # NOTA: bloc_test ^10 no se puede añadir con isar_generator 3.1 (conflicto
  # analyzer/test_api). Pendiente migrar isar -> isar_community y entonces
  # añadir bloc_test. Tests actuales usan emitsInOrder manual.

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
